# Lint, dependency-cycle check, the full test suite and a production-dependency audit, on every
# push and pull request, on both supported Node lines (package.json engines: >=22.13).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: No circular imports
        run: npx madge --circular --extensions js,mjs .
      - run: npm test
      - run: npm run audit
